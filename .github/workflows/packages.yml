name: Native packages

on:
  push:
    branches: [main]
    paths: ['packaging/**', '.github/workflows/packages.yml']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packages.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Attach verified packages to the existing matching release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64 libx11-6 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1 xvfb xauth desktop-file-utils
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Freeze application
        run: python packaging/build.py freeze
      - name: Build and install Ubuntu DEB
        if: runner.os == 'Linux'
        run: |
          python packaging/build.py linux
          desktop-file-validate packaging/linux/slipsurface.desktop
          sudo apt-get install -y ./dist/*.deb
          cd /tmp
          QT_QPA_PLATFORM=xcb timeout 120 xvfb-run -a /usr/bin/slipsurface --self-test /tmp/ubuntu-smoke.json
          cat /tmp/ubuntu-smoke.json
          sudo apt-get remove -y slipsurface-iq-le
          test ! -e /opt/slipsurface-iq-le/slipsurface
      - name: Install WiX 5
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: python packaging/build.py msi
      - name: Install, smoke test and uninstall Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/*.msi).FullName
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart', '/L*v', "`"$log`"") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { Get-Content $log -Tail 100; throw "MSI install failed: $($install.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'SlipSurfaceIQ LE/slipsurface.exe'
          $report = Join-Path $env:RUNNER_TEMP 'windows-smoke.json'
          $smoke = Start-Process $exe -ArgumentList @('--self-test', "`"$report`"") -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $smoke.WaitForExit(120000)) { $smoke.Kill(); throw 'Installed application timed out' }
          if ($smoke.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed application smoke test failed' }
          Get-Content $report
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', "`"$installer`"", '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -notin @(0, 3010) -or (Test-Path $exe)) { throw 'MSI uninstall failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-payload
          path: |
            dist/payload.tar.gz
            dist/PKGBUILD
            dist/fedora.spec
            dist/opensuse.spec
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*.msi
            dist/*.deb
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  rpm:
    name: RPM (${{ matrix.distro }})
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:44
            setup: dnf install -y rpm-build tar gzip findutils xorg-x11-server-Xvfb dejavu-sans-fonts
            install: dnf install -y
            remove: dnf remove -y
          - distro: opensuse
            image: opensuse/leap:16.0
            setup: zypper --non-interactive install rpm-build tar gzip findutils xorg-x11-server-Xvfb dejavu-fonts
            install: zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm
            remove: zypper --non-interactive remove
    container: ${{ matrix.image }}
    steps:
      - name: Native build tools
        run: ${{ matrix.setup }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-payload
          path: input
      - name: Build RPM and test installed application
        env:
          DISTRO: ${{ matrix.distro }}
          INSTALL: ${{ matrix.install }}
          REMOVE: ${{ matrix.remove }}
        shell: bash
        run: |
          set -euo pipefail
          top="$PWD/rpmbuild"
          mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,SRPMS} output
          cp input/payload.tar.gz "$top/SOURCES/"
          rpmbuild -bb --define "_topdir $top" "input/$DISTRO.spec"
          rpm_file=$(find "$top/RPMS" -name '*.rpm' -type f)
          $INSTALL "$rpm_file"
          Xvfb :99 -screen 0 1280x800x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" || true' EXIT
          sleep 2
          cd /tmp
          DISPLAY=:99 QT_QPA_PLATFORM=xcb timeout 120 /usr/bin/slipsurface --self-test /tmp/rpm-smoke.json
          cat /tmp/rpm-smoke.json
          $REMOVE slipsurface-iq-le
          test ! -e /opt/slipsurface-iq-le/slipsurface
          cd "$GITHUB_WORKSPACE"
          version=$(rpm -qp --queryformat '%{VERSION}' "$rpm_file")
          cp "$rpm_file" "output/slipsurface-iq-le-$version-1.$DISTRO.x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          path: output/*.rpm
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: bundle
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    steps:
      - name: Native build tools and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel libglvnd libxkbcommon-x11 \
            fontconfig dbus glib2 libx11 xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil xorg-server-xvfb ttf-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: linux-payload
          path: input
      - name: Build, install and test Arch package
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          cp input/PKGBUILD input/payload.tar.gz /home/builder/
          chown -R builder:builder /home/builder
          su builder -c 'cd /home/builder && makepkg --noconfirm'
          pacman -U --noconfirm /home/builder/*.pkg.tar.zst
          Xvfb :99 -screen 0 1280x800x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" || true' EXIT
          sleep 2
          cd /tmp
          DISPLAY=:99 QT_QPA_PLATFORM=xcb timeout 120 /usr/bin/slipsurface --self-test /tmp/arch-smoke.json
          cat /tmp/arch-smoke.json
          pacman -R --noconfirm slipsurface-iq-le
          test ! -e /opt/slipsurface-iq-le/slipsurface
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp /home/builder/*.pkg.tar.zst "$GITHUB_WORKSPACE/output/"
      - uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: output/*.pkg.tar.zst
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish verified release assets
    needs: [bundle, rpm, arch]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify release source and publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python packaging/build.py version)
          tag="v$version"
          # Packaging-only commits may follow a release. Application code must match.
          git diff --exit-code "$tag" HEAD -- main.py slipsurface pyproject.toml requirements.txt
          gh release view "$tag" --json tagName,isDraft --jq '.tagName'
          git archive --format=tar.gz --prefix="SlipSurfaceIQ-LE-$version/" HEAD \
            > "release-assets/SlipSurfaceIQ-LE-$version-package-source.tar.gz"
          cp packaging/README.md release-assets/INSTALL.md
          printf 'Recipe commit: %s\nRelease tag: %s\nApplication commit: %s\nWorkflow: %s/%s/actions/runs/%s\n' \
            "$(git rev-parse HEAD)" "$tag" "$(git rev-list -n 1 "$tag")" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-assets/BUILD-INFO.txt
          cd release-assets
          sha256sum *.msi *.deb *.rpm *.pkg.tar.zst *.tar.gz INSTALL.md BUILD-INFO.txt > SHA256SUMS
          # Upload only after every native install/smoke/uninstall job succeeds.
          # No --clobber: existing published files are never silently replaced.
          gh release upload "$tag" ./*
