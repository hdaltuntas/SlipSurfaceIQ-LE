name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verification:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run verification suite
        run: python verification/run.py --write
      - name: Results summary
        if: always()
        run: |
          if [ -f docs/verification.md ]; then cat docs/verification.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: docs/verification.md
