# Development tooling only. Run the application exclusively via python main.py.
# No build backend, distributable Python wheel, or console-script entry point.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "B", "UP"]
# E741: `l` (slice base length) and `I` are deliberate domain abbreviations
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = [
    "slipsurface/lem",
    "slipsurface/geometry",
    "slipsurface/materials",
    "slipsurface/optimizer",
    "slipsurface/analysis.py",
    "slipsurface/loads.py",
    "slipsurface/project.py",
]
