[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsurface-le"
dynamic = ["version"]
description = "2D limit equilibrium slope stability analysis (Slide2-style desktop GUI)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Hasan Deniz Altuntaş" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Natural Language :: Turkish",
    "Natural Language :: English",
]
dependencies = [
    "PySide6>=6.6",
    "numpy>=2.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "reportlab>=4.0",
    "ezdxf>=1.4,<2",
    "QtAwesome>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdf>=4.0", "ruff>=0.8", "mypy>=1.13"]

[project.gui-scripts]
slipsurface = "slipsurface.ui.app:run"

[tool.setuptools.dynamic]
version = { attr = "slipsurface.__version__" }

[tool.setuptools.packages.find]
include = ["slipsurface*"]

[tool.setuptools.package-data]
"slipsurface.report" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# E741: `l` (slice base length) and `I` are deliberate domain abbreviations
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = [
    "slipsurface/lem",
    "slipsurface/geometry",
    "slipsurface/materials",
    "slipsurface/optimizer",
    "slipsurface/analysis.py",
    "slipsurface/loads.py",
    "slipsurface/project.py",
]
