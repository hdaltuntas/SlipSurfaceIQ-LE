[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsurface-le"
dynamic = ["version"]
description = "2D limit equilibrium slope stability analysis (Slide2-style desktop GUI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hasan Deniz Altuntaş" }]
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "pypdf>=4.0"]

[project.gui-scripts]
slipsurface = "slipsurface.ui.app:run"

[tool.setuptools.dynamic]
version = { attr = "slipsurface.__version__" }

[tool.setuptools.packages.find]
include = ["slipsurface*"]

[tool.setuptools.package-data]
"slipsurface.report" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
